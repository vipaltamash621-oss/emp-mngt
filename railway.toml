[build]
builder = "dockerfile"
dockerfile = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
sleepApplication = false
startCommand = ""

[environment]
APP_NAME = "Employee Management System"
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stack"
CACHE_DRIVER = "file"
QUEUE_CONNECTION = "sync"
SESSION_DRIVER = "file"
ASSET_URL = "$RAILWAY_PUBLIC_DOMAIN"

# Database variables (will be overridden by Railway MySQL plugin)
# After adding MySQL service in Railway, these will auto-populate:
# DB_CONNECTION = "mysql"
# DB_HOST = "$MYSQL_HOST"
# DB_PORT = "$MYSQL_PORT"
# DB_DATABASE = "$MYSQL_DATABASE"
# DB_USERNAME = "$MYSQL_USER"
# DB_PASSWORD = "$MYSQL_PASSWORD"
