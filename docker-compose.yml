version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: emp_management_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emp_management
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: emp_password
      MYSQL_USER: emp_user
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - emp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emp_management_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_NAME=Employee Management System
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=emp_management
      - DB_USERNAME=emp_user
      - DB_PASSWORD=emp_password
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - emp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 10s
      retries: 3
      interval: 30s
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: emp_management_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: emp_user
      PMA_PASSWORD: emp_password
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - emp_network

volumes:
  dbdata:
    driver: local

networks:
  emp_network:
    driver: bridge
